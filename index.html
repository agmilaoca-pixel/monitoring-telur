<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin - Monitoring & Simulasi 3D Pengasinan Telur</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #090714;
      --card-bg: rgba(22, 14, 38, 0.78);
      --card-border: rgba(255, 42, 133, 0.28);
      --neon-pink: #ff2a85;
      --neon-cyan: #00f2fe;
      --neon-yellow: #fde047;
      --text-main: #fdf2f8;
      --text-muted: #c084fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Panggung 3D Three.js */
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay HUD */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .clickable { pointer-events: auto; }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .brand-box h1 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 20%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.8px;
    }
    .brand-box p { font-size: 11.5px; color: var(--neon-cyan); margin-top: 3px; font-weight: 600; }

    .status-pill {
      background: rgba(255, 42, 133, 0.15);
      border: 1px solid rgba(255, 42, 133, 0.4);
      color: #ff77b4;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

    /* Panel Kiri: Telemetri Slaves */
    .left-panel {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }
    .card-hud {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .card-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-node {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 42, 133, 0.2);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 42, 133, 0.4);
    }
    .badge-node.cyan {
      background: rgba(0, 242, 254, 0.18);
      color: var(--neon-cyan);
      border-color: rgba(0, 242, 254, 0.4);
    }
    .val-main {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      margin: 8px 0 4px 0;
      text-shadow: 0 0 16px rgba(255, 42, 133, 0.35);
    }
    .val-unit { font-size: 16px; color: var(--neon-yellow); font-weight: 600; }
    .card-meta { font-size: 11px; color: #d8b4fe; }

    /* Bottom Bar: Kontrol Aktuator & Navigasi 3D */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .action-hud {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      gap: 18px;
      align-items: center;
    }
    .btn-cam {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fdf2f8;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cam:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }
    .switch-ui {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Panggung Tiga Dimensi -->
  <div id="canvas3d"></div>

  <!-- Lapisan Antarmuka Layar (HUD) -->
  <div class="hud-layer">
    <div class="top-bar clickable">
      <div class="brand-box">
        <h1>DIGITAL TWIN: RUANG PENGASINAN TELUR</h1>
        <p>● SIMULASI FISIKA 3D & TELEMETRI ESP32</p>
      </div>
      <div class="status-pill" id="mqttStatus">
        <span class="dot"></span> EMQX Terhubung
      </div>
    </div>

    <!-- Panel Kiri -->
    <div class="left-panel clickable">
      <div class="card-hud">
        <div class="card-title">
          <span>Kepekatan Garam (TDS)</span>
          <span class="badge-node">SLAVE 1</span>
        </div>
        <div class="val-main"><span id="valGaram">0.0</span> <span class="val-unit">%</span></div>
        <div class="card-meta">DIFUSI ION: <span id="txtDifusi">Aktif Bertahap</span></div>
      </div>

      <div class="card-hud">
        <div class="card-title">
          <span>Ketinggian Air Larutan</span>
          <span class="badge-node">SLAVE 1</span>
        </div>
        <div class="val-main"><span id="valWater">0</span> <span class="val-unit">%</span></div>
        <div class="card-meta">VOLUME BEJANA: <span id="txtVolume">Tenggelam Sempurna</span></div>
      </div>

      <div class="card-hud">
        <div class="card-title">
          <span>Suhu Ruang Inkubasi</span>
          <span class="badge-node cyan">SLAVE 2</span>
        </div>
        <div class="val-main"><span id="valSuhuRuang">0.0</span> <span class="val-unit">°C</span></div>
        <div class="card-meta">KELEMBABAN: <span id="valHum" style="color:var(--neon-pink); font-weight:700;">0.0%</span></div>
      </div>
    </div>

    <!-- Baris Bawah -->
    <div class="bottom-bar clickable">
      <div class="action-hud">
        <button class="btn-cam" onclick="setCamTop()">Sudut Atas (Top)</button>
        <button class="btn-cam" onclick="setCamFront()">Sudut Depan (Front)</button>
        <button class="btn-cam" onclick="setCamIso()">Sudut Isometrik</button>
      </div>

      <div class="action-hud">
        <div class="switch-ui">
          <span>Lampu Pemanas (Heater)</span>
          <input type="checkbox" id="btnToggleLampu" onchange="toggleLampu(this.checked)" style="transform: scale(1.4); cursor: pointer;">
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SETUP THREE.JS 3D ENVIRONMENT ---
    const container = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090714, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Pencahayaan
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const pinkKeyLight = new THREE.PointLight(0xff2a85, 2.5, 30);
    pinkKeyLight.position.set(-6, 8, 5);
    scene.add(pinkKeyLight);

    const cyanRimLight = new THREE.PointLight(0x00f2fe, 2.5, 30);
    cyanRimLight.position.set(6, 6, -5);
    scene.add(cyanRimLight);

    const heaterLight = new THREE.PointLight(0xffaa22, 0.0, 20);
    heaterLight.position.set(0, 7, 0);
    scene.add(heaterLight);

    const grid = new THREE.GridHelper(30, 30, 0xff2a85, 0x1f1435);
    grid.position.y = -2;
    scene.add(grid);

    // --- 2. OBJEK 3D BEJANA & TELUR ASIN ---
    const groupTank = new THREE.Group();
    scene.add(groupTank);

    const jarGeo = new THREE.CylinderGeometry(2.6, 2.6, 4.8, 36, 1, true);
    const jarMat = new THREE.MeshPhysicalMaterial({
      color: 0x00f2fe,
      transmission: 0.92,
      opacity: 1,
      transparent: true,
      roughness: 0.05,
      ior: 1.5,
      side: THREE.DoubleSide
    });
    const jarMesh = new THREE.Mesh(jarGeo, jarMat);
    jarMesh.position.y = 0.4;
    groupTank.add(jarMesh);

    const waterGeo = new THREE.CylinderGeometry(2.5, 2.5, 3.8, 32);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x0077be,
      transparent: true,
      opacity: 0.55,
      roughness: 0.1
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.y = -0.1;
    groupTank.add(waterMesh);

    const eggGeo = new THREE.SphereGeometry(0.9, 32, 28);
    eggGeo.scale(1, 1.35, 1);
    const eggMat = new THREE.MeshStandardMaterial({
      color: 0xca8a04,
      roughness: 0.6,
      metalness: 0.1
    });

    const eggs = [];
    const eggPositions = [
      { x: 0, y: -0.6, z: 0 },
      { x: 0.9, y: -0.7, z: 0.6 },
      { x: -0.8, y: -0.5, z: -0.5 }
    ];

    eggPositions.forEach((pos) => {
      const egg = new THREE.Mesh(eggGeo, eggMat.clone());
      egg.position.set(pos.x, pos.y, pos.z);
      egg.rotation.z = Math.random() * 0.4 - 0.2;
      groupTank.add(egg);
      eggs.push(egg);
    });

    const ionCount = 120;
    const ionGeo = new THREE.BufferGeometry();
    const ionPos = new Float32Array(ionCount * 3);
    for (let i = 0; i < ionCount * 3; i += 3) {
      ionPos[i] = (Math.random() - 0.5) * 4.2;
      ionPos[i + 1] = (Math.random() - 0.5) * 3.5;
      ionPos[i + 2] = (Math.random() - 0.5) * 4.2;
    }
    ionGeo.setAttribute('position', new THREE.BufferAttribute(ionPos, 3));
    const ionMat = new THREE.PointsMaterial({
      color: 0x00f2fe,
      size: 0.08,
      transparent: true,
      opacity: 0.8
    });
    const ionParticles = new THREE.Points(ionGeo, ionMat);
    groupTank.add(ionParticles);

    function setCamIso() {
      camera.position.set(7, 5, 8);
      camera.lookAt(0, 0.4, 0);
    }
    function setCamFront() {
      camera.position.set(0, 0.5, 9);
      camera.lookAt(0, 0.4, 0);
    }
    function setCamTop() {
      camera.position.set(0, 10, 0.1);
      camera.lookAt(0, 0, 0);
    }
    setCamIso();

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      groupTank.rotation.y += 0.005;

      eggs.forEach((egg, index) => {
        egg.position.y += Math.sin(elapsed * 2 + index) * 0.0015;
      });

      const positions = ionParticles.geometry.attributes.position.array;
      for (let i = 1; i < ionCount * 3; i += 3) {
        positions[i] -= 0.006;
        if (positions[i] < -1.8) positions[i] = 1.8;
      }
      ionParticles.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 3. KONEKSI MQTT EMQX CLOUD ---
    const mqttOptions = {
      clean: true,
      connectTimeout: 4000,
      clientId: 'web_3d_' + Math.random().toString(16).substring(2, 8),
      username: 'mila',
      password: 'Mila12345' // <-- Ganti dengan password EMQX milikmu
    };

    const client = mqtt.connect('wss://o110101d.ala.eu-central-1.emqxsl.com:8084/mqtt', mqttOptions);

    client.on('connect', () => {
      document.getElementById('mqttStatus').innerHTML = '<span class="dot"></span> EMQX Terhubung';
      client.subscribe('telur/slave/#');
      client.subscribe('telur/kontrol/#');
    });

    client.on('message', (topic, message) => {
      const val = message.toString();

      if (topic === 'telur/slave/1') {
        document.getElementById('valGaram').innerText = val;
        const tds = parseFloat(val) || 0;
        ionMat.size = 0.05 + (tds * 0.008);
        document.getElementById('txtDifusi').innerText = tds > 10 ? "Difusi Jenuh Kuat" : "Penetrasi Normal";

      } else if (topic === 'telur/slave/water') {
        document.getElementById('valWater').innerText = val;
        const waterPct = Math.min(Math.max(parseFloat(val) || 0, 10), 100);
        const targetScale = waterPct / 100;
        waterMesh.scale.set(1, targetScale, 1);
        waterMesh.position.y = -0.1 - (1 - targetScale) * 1.5;

      } else if (topic === 'telur/slave/2' || topic === 'telur/slave/suhu') {
        document.getElementById('valSuhuRuang').innerText = val;

      } else if (topic === 'telur/slave/hum') {
        document.getElementById('valHum').innerText = val + '%';

      } else if (topic === 'telur/kontrol/heater') {
        const isNyala = val === 'ON';
        document.getElementById('btnToggleLampu').checked = isNyala;
        heaterLight.intensity = isNyala ? 3.5 : 0.0;
      }
    });

    function toggleLampu(state) {
      client.publish('telur/kontrol/heater', state ? 'ON' : 'OFF');
      heaterLight.intensity = state ? 3.5 : 0.0;
    }
  </script>
</body>
</html>
